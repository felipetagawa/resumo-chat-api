gemini:
  api:
    key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash-lite}
    smart-reply-model: ${GEMINI_SMART_REPLY_MODEL:}
    smart-reply-premium-enabled: ${GEMINI_SMART_REPLY_PREMIUM_ENABLED:false}
    smart-reply-read-timeout-millis: ${GEMINI_SMART_REPLY_READ_TIMEOUT_MILLIS:4000}
    generate-content-base-url: ${GEMINI_GENERATE_CONTENT_BASE_URL:https://generativelanguage.googleapis.com/v1/models}
    max-attempts: ${GEMINI_MAX_ATTEMPTS:4}
    initial-delay-millis: ${GEMINI_INITIAL_DELAY_MILLIS:500}
    backoff-multiplier: ${GEMINI_BACKOFF_MULTIPLIER:2.0}
    max-retry-after-millis: ${GEMINI_MAX_RETRY_AFTER_MILLIS:5000}
    connect-timeout-millis: ${GEMINI_CONNECT_TIMEOUT_MILLIS:2000}
    read-timeout-millis: ${GEMINI_READ_TIMEOUT_MILLIS:8000}

typesafe:
  api:
    key: ${TYPESAFE_API_KEY:}
    model: ${TYPESAFE_MODEL:jev-latest}
    system-one-url: ${TYPESAFE_SYSTEM_ONE_URL:https://api.typesafe.ai/v1/systemone}
    connect-timeout-millis: ${TYPESAFE_CONNECT_TIMEOUT_MILLIS:1000}
    read-timeout-millis: ${TYPESAFE_READ_TIMEOUT_MILLIS:2500}
    max-conversation-chars: ${TYPESAFE_MAX_CONVERSATION_CHARS:20000}
    rate-limit-per-minute: ${TYPESAFE_RATE_LIMIT_PER_MINUTE:120}

smart-reply:
  rate-limit-per-minute: ${SMART_REPLY_RATE_LIMIT_PER_MINUTE:30}
